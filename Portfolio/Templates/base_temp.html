<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matang Mehra {% block title %} {% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/default.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.png' ) }}" type="image/x-icon">
</head>
<body>
    <div class="background-video">
        <video autoplay muted loop>
            <source src="{{ url_for('static', filename='videos/background.mp4') }}" type="video/mp4">
        </video>
    </div>

    <div class="main-container">
        <header>
            <nav>
                <ul>
                    <li><a href="{{ url_for('home_page') }}">Home</a></li>
                    <li><a href="{{ url_for('about_page') }}">About</a></li>
                    <li><a href="{{ url_for('blogs_page') }}">Blogs</a></li>
                    <li><a href="{{ url_for('projects_page') }}">Projects</a></li> 
                </ul>
            </nav>
        </header>

        {% block content %} 
        
        {% endblock %}

        <footer>
            <p>&copy; 2024 Matang Mehera</p>
        </footer>
    </div>

</body>
</html>
